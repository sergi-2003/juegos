<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Olvidé mi contraseña</title>
</head>
<body>
  <h1>Recuperar contraseña</h1>

  <form id="forgotForm">
    <label>Email</label><br/>
    <input id="email" type="email" required autocomplete="email" /><br/><br/>
    <button type="submit">Enviar instrucciones</button>
  </form>

  <p id="msg"></p>

  <script>
    const form = document.getElementById("forgotForm");
    const msg = document.getElementById("msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "Enviando...";

      const email = document.getElementById("email").value.trim();

      try {
        const res = await fetch(`/api/auth/forgot-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });

        const data = await res.json().catch(() => ({}));

        msg.textContent = data.message || "Si el correo existe, enviaremos instrucciones.";

        if (data.dev_reset_url) {
          msg.innerHTML += `<br/><br/><strong>DEV LINK:</strong> <a href="${data.dev_reset_url}">${data.dev_reset_url}</a>`;
        }
      } catch (err) {
        console.error(err);
        msg.textContent = "Error de conexión. Revisa el servidor.";
      }
    });
  </script>
</body>
</html>
