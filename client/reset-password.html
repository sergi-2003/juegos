<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Restablecer contraseña</title>
</head>
<body>
  <h1>Restablecer contraseña</h1>

  <form id="resetForm">
    <label>Nueva contraseña</label><br/>
    <input id="newPassword" type="password" required autocomplete="new-password" /><br/><br/>
    <button type="submit">Cambiar contraseña</button>
  </form>

  <p id="msg"></p>

  <script>
    const msg = document.getElementById("msg");
    const form = document.getElementById("resetForm");

    // Leer token del query string: ?token=xxxx
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    if (!token) {
      msg.textContent = "Falta el token. Abre el enlace correcto.";
      form.style.display = "none";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.textContent = "Actualizando...";

      const newPassword = document.getElementById("newPassword").value;

      try {
        const res = await fetch(`/api/auth/reset-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, newPassword })
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          msg.textContent = data.error || data.message || "No se pudo cambiar la contraseña";
          return;
        }

        msg.textContent = data.message || "Contraseña actualizada correctamente";

        // Redirigir al login
        setTimeout(() => {
          window.location.href = "./index.html";
        }, 1500);

      } catch (err) {
        console.error(err);
        msg.textContent = "Error de conexión. Revisa el servidor.";
      }
    });
  </script>
</body>
</html>
